<!doctype html>
<meta charset="utf-8" />
<title>CardCodex page bench</title>
<!--
  End-to-end binder-page benchmark: the real pipeline on the fixture photos — fitGridOnSource, then
  scanPage with the Tesseract recognizer and the Pokémon matcher (OCR + artwork hashes) — and, per
  pocket, whether the candidate is the expected card and whether it was called confident. Served by
  the Vite dev server, which compiles the TS:

    npm run dev
    http://localhost:5173/scripts/page-bench.html
      ?imgs=scripts/fixtures/binder-pages/fold8-9pocket.jpg
      &expected={"fold8-9pocket.jpg":["swsh10.5-016",…]}   (row-major catalog ids)
      &hash=1  &strip=1  &layout=3x3  &report=/__page-bench     (all optional)

  `hash=0` runs scanPage with `artwork: false` (the OCR-only baseline). `report` POSTs the JSON
  there when done (scripts/page-bench.mjs); results are also in window.__pageBench.
-->
<style>
  body { font: 13px/1.4 ui-monospace, Consolas, monospace; margin: 16px; }
  pre { white-space: pre-wrap; }
</style>
<h1>page bench</h1>
<pre id="out">running…</pre>
<script type="module">
  import { fitGridOnSource } from '/src/scanner/grid.ts';
  import { scanPage, pageLayout, DEFAULT_CARD_MM } from '/src/scanner/page.ts';
  import { createPokemonMatcher } from '/src/scanner/match.ts';
  import { TesseractRecognizer } from '/src/scanner/tesseract.ts';
  import { loadHashTable } from '/src/scanner/artwork.ts';

  const q = new URLSearchParams(location.search);
  const DEFAULT_IMAGES = ['scripts/fixtures/binder-pages/fold8-9pocket.jpg', 'scripts/fixtures/binder-pages/pixel11-9pocket.jpg', 'scripts/fixtures/binder-pages/pixel11-9pocket-b.jpg'];
  const images = (q.get('imgs') || DEFAULT_IMAGES.join(',')).split(',').map((s) => s.trim()).filter(Boolean);
  const expectedByImage = JSON.parse(q.get('expected') || '{}');
  const layout = pageLayout(q.get('layout') || '3x3');
  const useHash = q.get('hash') !== '0';
  const strip = q.get('strip') !== '0';
  const aspect = DEFAULT_CARD_MM.w / DEFAULT_CARD_MM.h;
  const out = document.getElementById('out');
  const r3 = (v) => Math.round(v * 1000) / 1000;
  const heap = () => performance.memory?.usedJSHeapSize ?? null;

  const catalog = await fetch('/data/catalog.json', { cache: 'no-cache' }).then((r) => r.json());
  const t0 = performance.now();
  const matcher = createPokemonMatcher(catalog);
  const matcherMs = Math.round(performance.now() - t0);
  const nameOf = (id) => catalog.cards.find((c) => c.id === id)?.name ?? '?';

  // The table: loaded through the scanner's own loader, timed and sized.
  let table = false;
  let tableInfo = null;
  if (useHash) {
    const h0 = heap();
    const t1 = performance.now();
    table = await loadHashTable('pokemon');
    const loadMs = Math.round(performance.now() - t1);
    const h1 = heap();
    tableInfo = table
      ? { ids: table.ids.length, loadMs, heapDeltaBytes: h0 !== null && h1 !== null ? h1 - h0 : null, wordsBytes: table.words.byteLength }
      : { error: 'no table' };
  }

  const recognizer = new TesseractRecognizer({ langPath: '/tessdata' });
  const results = { hash: useHash, strip, matcherMs, table: tableInfo, images: [] };

  for (const image of images) {
    const url = image.startsWith('/') || image.startsWith('http') ? image : '/' + image;
    const name = image.split('/').pop();
    const expected = expectedByImage[name] || [];
    const rec = { image, pockets: [] };
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status} for ${url}`);
      const bmp = await createImageBitmap(await res.blob());
      rec.width = bmp.width;
      rec.height = bmp.height;
      const region = { x: 0, y: 0, w: bmp.width, h: bmp.height };
      const fit = fitGridOnSource(bmp, region, layout, { cardAspect: aspect });
      if (!fit) throw new Error('no grid fit');
      rec.fit = { confidence: r3(fit.confidence) };
      const t2 = performance.now();
      const scans = await scanPage(bmp, layout, recognizer, matcher, {
        geometry: { page: fit.box },
        artwork: useHash ? table : false,
        numberStrip: strip,
        onProgress: (done, total) => (out.textContent = `${name}: ${done}/${total}\n` + JSON.stringify(results, null, 1)),
      });
      rec.pageMs = Math.round(performance.now() - t2);
      rec.hashMs = Math.round(scans.reduce((s, p) => s + (p.hashMs ?? 0), 0));
      for (const p of scans) {
        const exp = expected[p.pocket.index];
        const got = p.candidate?.card.id;
        const alts = p.alternatives.map((a) => a.card.id);
        rec.pockets.push({
          index: p.pocket.index,
          expected: exp,
          expectedName: exp ? nameOf(exp) : undefined,
          got,
          gotName: got ? nameOf(got) : undefined,
          exact: !!exp && got === exp,
          inAlternatives: !!exp && got !== exp && alts.includes(exp),
          confident: !!p.candidate?.confident,
          score: p.candidate ? r3(p.candidate.score) : null,
          margin: p.candidate ? r3(p.candidate.margin) : null,
          evidence: p.candidate?.evidence ?? [],
          alternatives: p.alternatives.slice(0, 4).map((a) => ({ id: a.card.id, score: r3(a.score) })),
          lineCount: p.lineCount,
          ms: Math.round(p.ms),
          hashMs: p.hashMs === undefined ? undefined : Math.round(p.hashMs),
          artwork: p.artwork?.slice(0, 3).map((h) => ({ id: h.id, d: h.distance })),
        });
      }
      bmp.close();
    } catch (e) {
      rec.error = String(e && e.message ? e.message : e);
    }
    results.images.push(rec);
    out.textContent = JSON.stringify(results, null, 1);
  }
  await recognizer.dispose();
  window.__pageBench = results;
  document.title = 'page bench: done';
  const report = q.get('report');
  if (report) {
    await fetch(report, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(results) });
  }
</script>
