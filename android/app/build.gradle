apply plugin: 'com.android.application'

// App version comes from package.json ("1.2.3" → versionName 1.2.3, versionCode 10203),
// so bumping the npm version is the whole release-numbering step.
def packageJson = new groovy.json.JsonSlurper().parse(rootProject.file('../package.json'))
def semver = (packageJson.version as String).tokenize('.').collect { it.replaceAll(/\D.*/, '').toInteger() }
while (semver.size() < 3) semver << 0
def appVersionName = packageJson.version as String
def appVersionCode = semver[0] * 10000 + semver[1] * 100 + semver[2]

// Release signing: android/keystore.properties (gitignored; see README "Android") or, in CI,
// the ANDROID_KEYSTORE_* environment variables. Without either, release builds are unsigned.
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) keystorePropsFile.withInputStream { keystoreProps.load(it) }
def signingStoreFile = System.getenv('ANDROID_KEYSTORE_PATH') ?: keystoreProps['storeFile']
def signingStorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD') ?: keystoreProps['storePassword']
def signingKeyAlias = System.getenv('ANDROID_KEY_ALIAS') ?: keystoreProps['keyAlias']
def signingKeyPassword = System.getenv('ANDROID_KEY_PASSWORD') ?: keystoreProps['keyPassword']
def hasReleaseSigning = signingStoreFile && signingStorePassword && signingKeyAlias && signingKeyPassword

android {
    namespace = "com.independent.cardcodex"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.independent.cardcodex"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile rootProject.file(signingStoreFile)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }
    }
    // ML Kit ships native text-recognition libraries for every ABI (~45 MB in
    // one universal APK). Per-ABI APKs keep each download to roughly a third of
    // that; the universal one is still produced for emulators and sideloading.
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86_64'
            universalApk true
        }
    }
    // Name outputs CardCodex-<version>-<abi>-<buildType>.apk instead of app-<abi>-<buildType>.apk.
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def abi = output.filters.find { it.filterType == 'ABI' }?.identifier ?: 'universal'
            outputFileName = "CardCodex-${variant.versionName}-${abi}-${variant.buildType.name}.apk"
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
